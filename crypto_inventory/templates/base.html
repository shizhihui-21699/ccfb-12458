<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}密码资产盘点平台{% endblock %}</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d333b;
  --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  --critical:#f85149; --high:#ff9f43; --medium:#e3b341; --info:#3fb950;
  --pq-safe:#3fb950; --pq-vuln:#ff9f43; --pq-adjust:#e3b341; --broken:#f85149;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);
  padding:22px 0;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand h1{font-size:16px;margin:0 0 4px}
.brand small{color:var(--muted)}
.nav a{display:block;padding:10px 22px;color:var(--muted);border-left:3px solid transparent}
.nav a.active,.nav a:hover{color:var(--fg);background:var(--panel2);text-decoration:none;
  border-left-color:var(--accent)}
.main{flex:1;padding:28px 34px;max-width:100%;min-width:0}
.page-head{margin-bottom:22px}
.page-head h2{margin:0 0 6px;font-size:22px}
.page-head p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
.card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.card .v{font-size:30px;font-weight:650;margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);
  vertical-align:top;font-size:13px}
th{background:var(--panel2);color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(88,166,255,.05)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;
  font-weight:600;white-space:nowrap}
.b-critical{background:rgba(248,81,73,.15);color:var(--critical)}
.b-high{background:rgba(255,159,67,.15);color:var(--high)}
.b-medium{background:rgba(227,179,65,.15);color:var(--medium)}
.b-info{background:rgba(63,185,80,.15);color:var(--info)}
.b-pq-safe{background:rgba(63,185,80,.15);color:var(--pq-safe)}
.b-pq-vulnerable{background:rgba(255,159,67,.15);color:var(--pq-vuln)}
.b-pq-adjust{background:rgba(227,179,65,.15);color:var(--pq-adjust)}
.b-broken-classical{background:rgba(248,81,73,.15);color:var(--broken)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.sys-row{cursor:pointer}
.score-ring{display:inline-flex;align-items:center;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filters select,.filters input{background:var(--panel2);border:1px solid var(--border);
  color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px}
.filters input{min-width:240px}
.btn{background:var(--accent);color:#0d1117;border:none;border-radius:8px;
  padding:8px 16px;font-weight:600;cursor:pointer;font-size:13px}
.btn.secondary{background:var(--panel2);color:var(--fg);border:1px solid var(--border)}
.btn:hover{opacity:.9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tabs button{background:none;border:none;color:var(--muted);padding:10px 16px;
  cursor:pointer;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--fg);border-bottom-color:var(--accent)}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;margin-bottom:8px;display:flex;gap:14px;align-items:flex-start}
.state{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;flex-shrink:0;min-width:62px;text-align:center}
.state-done{background:rgba(63,185,80,.18);color:var(--info)}
.state-inprogress{background:rgba(88,166,255,.18);color:var(--accent)}
.state-todo{background:rgba(248,81,73,.15);color:var(--critical)}
.muted{color:var(--muted)}
.context{color:var(--muted);font-size:12px;word-break:break-all}
.section-title{font-size:15px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.sidebar{width:64px}.brand h1,.nav span{display:none}}
.pill-count{background:var(--panel2);border-radius:12px;padding:1px 8px;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0 18px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <h1>🔐 密码资产盘点</h1>
      <small>Crypto Asset Inventory · PQ Readiness</small>
    </div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active=='dashboard' else '' }}">📊 总览仪表盘</a>
      <a href="/findings" class="{{ 'active' if active=='findings' else '' }}">🔍 发现明细</a>
      <a href="/cbom" class="{{ 'active' if active=='cbom' else '' }}">📦 密码物料清单</a>
      <a href="#" id="nav-systems" style="display:none">系统详情</a>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
